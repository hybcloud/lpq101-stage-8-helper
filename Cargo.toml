[package]
name = "lpq101-stage-8-helper"
version = "0.3.0"
edition = "2024"
description = "Native Direct2D constant-weight Gray-code overlay for Ludibrium Party Quest Stage 8"
homepage = "https://github.com/hybcloud/lpq101-stage-8-helper"
repository = "https://github.com/hybcloud/lpq101-stage-8-helper"

[dependencies]
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tungstenite = { version = "0.26", features = ["native-tls"] }
ureq = { version = "2.12", features = ["json"] }
uuid = { version = "1.18", features = ["v4"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
