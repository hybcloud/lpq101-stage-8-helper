<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#e8d5aa" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'self'"
		/>
		<meta name="description" content="Ludibrium Party Quest Stage 8 room helper" />
		<title>Ludibrium Party Quest · Stage 8 Helper</title>
		<link rel="stylesheet" href="/styles.css" />
		<script type="module" src="/app.js"></script>
	</head>
	<body>
		<main id="app" class="min-h-dvh"></main>
		<div
			id="toast"
			class="pointer-events-none fixed inset-x-4 bottom-[max(1rem,env(safe-area-inset-bottom))] z-50 mx-auto max-w-sm translate-y-3 rounded-2xl border border-slate-700 bg-slate-900/95 px-4 py-3 text-center text-sm font-medium text-slate-100 opacity-0 shadow-2xl shadow-black/40 backdrop-blur transition duration-200"
			role="status"
			aria-live="polite"
		></div>
		<noscript>This helper requires JavaScript.</noscript>
	</body>
</html>
